version: '3.8'

services:
  botmax:
    build: .
    container_name: botmax_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    container_name: botmax_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - botmax

volumes:
  caddy_data:
  caddy_config:
